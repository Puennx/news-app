<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Brief</title>
  <meta name="description" content="ข่าวดีไซน์ AI เทค เศรษฐกิจ หุ้น สรุปเป็นไทย อัปเดตทุกเช้า">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
      background: #F2F2F2;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 628px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* Header */
    .header { margin-bottom: 24px; }
    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .header-title { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
    .header-meta { font-size: 12px; color: #9B9B9B; }
    .header-sub { font-size: 13px; color: #6B6B6B; }

    /* Filters */
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }
    .filter-btn.active {
      background: #1A1A1A;
      color: #fff;
      border: none;
      font-weight: 500;
    }
    .filter-btn.inactive {
      background: #fff;
      color: #1A1A1A;
      border: 0.5px solid #DEDEDE;
    }
    .filter-btn.inactive .count { color: #9B9B9B; }
    .filter-btn.active .count { opacity: 0.6; }

    /* News list */
    .news-list { display: flex; flex-direction: column; gap: 10px; }

    article {
      background: #fff;
      border: 0.5px solid #E0E0E0;
      border-radius: 12px;
      padding: 16px 18px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .badge { padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .card-source { color: #6B6B6B; }
    .card-dot { color: #CFCFCF; }
    .card-time { color: #9B9B9B; }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #1A1A1A;
      text-decoration: none;
      display: block;
    }
    .card-title:hover { text-decoration: underline; }
    .card-summary { font-size: 14px; color: #6B6B6B; line-height: 1.65; margin-bottom: 12px; }

    .card-footer { display: flex; justify-content: flex-end; }
    .card-read-more {
      font-size: 12px;
      color: #9B9B9B;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.12s;
    }
    .card-read-more:hover { color: #1A1A1A; }

    /* Empty state */
    #empty { display: none; text-align: center; padding: 64px 0; color: #9B9B9B; font-size: 14px; }

    /* Footer */
    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #E5E5E5;
      text-align: center;
      font-size: 12px;
      color: #9B9B9B;
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="header-top">
        <h1 class="header-title">Daily Brief</h1>
        <span id="updated" class="header-meta">กำลังโหลด...</span>
      </div>
      <p class="header-sub">ข่าวดีไซน์ AI เทค เศรษฐกิจ หุ้น สรุปไทยทุกเช้า</p>
    </header>

    <div id="filters" class="filters"></div>
    <main id="news" class="news-list"></main>
    <div id="empty"><p>ยังไม่มีข่าวในหมวดนี้วันนี้</p></div>

    <footer>Daily Brief · อัปเดตอัตโนมัติทุกวัน 7:00 น. (ICT)</footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
