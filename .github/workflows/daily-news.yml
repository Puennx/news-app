name: Daily News Update

on:
  schedule:
    # 00:00 UTC = 07:00 ICT
    # GitHub cron อาจดีเลย์ 5-15 นาที (ไม่ใช่ปัญหา)
    - cron: '0 0 * * *'
  workflow_dispatch:   # ให้กดรันเองได้จาก Actions tab

permissions:
  contents: write       # ต้องเขียน commit กลับ repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and summarize news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news $(date -u +%Y-%m-%d)"
            git push
          fi
